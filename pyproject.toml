[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "httpx2-pycurl"
version = "0.0.7"
description = "An httpx2 transport powered by pycurl"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx2>=2.16", "pycurl>=7.45", "certifi"]
license = "MIT"
license-file = "LICENSE"

[project.urls]
Homepage = "https://www.github.com/dholth/httpx2-pycurl"

[project.optional-dependencies]
dev = ["pytest>=8.2"]
test = ["pytest-asyncio", "trustme"]

[tool.hatch.build.targets.wheel]
packages = ["src/httpx2_pycurl"]

[tool.pytest]
norecursedirs = ["httpx2"]
pythonpath = ["src"]

[tool.ruff]
exclude = ["httpx2"]

[tool.ruff.lint]
extend-select = ["I"]
