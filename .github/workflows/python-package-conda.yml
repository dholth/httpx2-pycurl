name: Tests
on: [ push, pull_request ]
env:
  CONDA_QUIET: "1"
jobs:
  build-linux:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
      - uses: actions/checkout@v4
        with:
          path: httpx2-pycurl

      - name: Checkout httpx2
        uses: actions/checkout@v4
        with:
          repository: pydantic/httpx2
          path: httpx2

      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      - name: Set up conda
        uses: conda-incubator/setup-conda-standalone@00a34805e93a8b640aee5f8a20e8f481ad77e3b4 # v0.1.0
        with:
          channel: conda-forge
          destination-directory: ${{ runner.temp }}/conda-standalone

      - name: Create conda environment
        run: |
          "$CONDA_EXE" create --yes --prefix "$RUNNER_TEMP/conda-env" -c conda-forge python=3.11 conda-pypi pytest nginx pytest-asyncio pytest-xprocess trustme httpx2 pycurl h2 chardet zstandard brotli trio uvicorn cryptography
          echo "$RUNNER_TEMP/conda-env/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          "$RUNNER_TEMP/conda-env/bin/conda" pypi install --prefix "$RUNNER_TEMP/conda-env" -c conda-forge socksio
          "$RUNNER_TEMP/conda-env/bin/conda" pypi install --prefix "$RUNNER_TEMP/conda-env" -c conda-forge --editable httpx2-pycurl/

      - name: Apply httpx2 patch
        run: |
          cd httpx2
          git apply ../httpx2-pycurl/tests/httpx2-tests.patch

      - name: Run httpx2-pycurl tests
        run: |
          cd httpx2-pycurl
          pytest

      - name: Run httpx2 tests with httpx2-pycurl transport
        run: |
          cd httpx2
          pytest -k "not anyio and not test_main and not autodetect and not cp_1252 and not cp1252 and not explicit_encoding" -v
